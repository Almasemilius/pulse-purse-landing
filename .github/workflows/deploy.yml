name: Build and Deploy

on:
  push:
    branches:
      - deploy

# Set IMAGE_NAME to your Docker Hub repo (e.g. jsmith/pulse-purse-landing).
# COMPOSE_DIR is the path on the VPS where docker-compose.yml lives.
env:
  IMAGE_NAME: almasemilius/pulse-purse-landing
  COMPOSE_DIR: ~/services/pulsepurse/landing

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ env.COMPOSE_DIR }}
            docker compose pull
            docker compose up -d --remove-orphans
            echo "✅ Deployed: ${{ env.IMAGE_NAME }}:latest"
            docker compose ps
